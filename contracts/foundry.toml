[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# docs/DECISIONS.md — 17 Ağustos 2026, Solidity sürüm aralığı:
# pragma ^0.8.20 ve optimizer açık. solc sürümü sabitlendi ki Akif ve Hakan
# birebir aynı bytecode'u derlesin (gas ölçümlerinin karşılaştırılabilir olması için).
solc = "0.8.20"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

# Her forge test --gas-report çağrısı tüm kontratları raporlasın.
gas_reports = ["*"]

remappings = ["forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
